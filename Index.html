<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prueba menú móvil</title>
<style>
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24313A;background:#F7F3EE}
  header{height:68px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
  .logo{font-weight:800;letter-spacing:.08em}
  .menu-button{width:46px;height:46px;border:1px solid #ddd;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;touch-action:manipulation}
  .menu-button span{display:block;width:23px;height:2px;background:#24313A;border-radius:2px}
  .menu{display:none;position:fixed;left:0;right:0;top:68px;background:#fff;border-bottom:1px solid #ddd;box-shadow:0 10px 25px rgba(0,0,0,.12);z-index:20;padding:8px 18px 16px}
  .menu.open{display:block}
  .menu a{display:block;padding:15px 8px;border-bottom:1px solid #eee;color:#24313A;text-decoration:none;font-weight:700}
  main{padding:20px}
  section{min-height:520px;padding:70px 10px;border-bottom:1px solid #ddd}
  section h2{font-family:Georgia,serif;font-size:34px}
  .status{padding:16px;border-radius:12px;background:#fff;border:1px solid #ddd;margin:10px 0 20px}
  #contacto{min-height:650px}
</style>
</head>
<body>
<header>
  <div class="logo">AMANDA</div>
  <button id="menuButton" class="menu-button" type="button" aria-label="Abrir menú" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<nav id="menu" class="menu" aria-hidden="true">
  <a href="#servicios">Servicios</a>
  <a href="#experiencia">Mi experiencia</a>
  <a href="#contacto">Contacto</a>
</nav>

<main>
  <div class="status" id="status">Estado: menú cerrado</div>
  <section id="servicios"><h2>Servicios</h2><p>Si has llegado aquí desde el menú, la navegación funciona.</p></section>
  <section id="experiencia"><h2>Mi experiencia</h2><p>Esta es una prueba aislada del menú.</p></section>
  <section id="contacto"><h2>Contacto</h2><p>La página de prueba funciona.</p></section>
</main>

<script>
(function(){
  const button = document.getElementById('menuButton');
  const menu = document.getElementById('menu');
  const status = document.getElementById('status');

  function closeMenu(){
    menu.classList.remove('open');
    button.setAttribute('aria-expanded','false');
    menu.setAttribute('aria-hidden','true');
    status.textContent='Estado: menú cerrado';
  }

  function toggleMenu(){
    const opening = !menu.classList.contains('open');
    if(opening){
      menu.classList.add('open');
      button.setAttribute('aria-expanded','true');
      menu.setAttribute('aria-hidden','false');
      status.textContent='Estado: MENÚ ABIERTO';
    }else{
      closeMenu();
    }
  }

  button.addEventListener('click', toggleMenu, false);

  menu.querySelectorAll('a').forEach(function(link){
    link.addEventListener('click', function(){
      closeMenu();
    }, false);
  });
})();
</script>
</body>
</html>
